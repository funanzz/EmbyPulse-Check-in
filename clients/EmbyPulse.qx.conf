# EmbyPulse 自动签到。将各区段的配置合并到现有 Quantumult X 配置。
# 替换两处 #instances= 后的示例。用 %3B 分隔站点，用 %7Crenew 标记续期。

[rewrite_local]
^https://[A-Za-z0-9.-]+(?::[0-9]+)?/api/(?:user/points/info|requests/logout)(?:\?[^#]*)?$ url script-response-body https://raw.githubusercontent.com/funanzz/EmbyPulse-Check-in/refs/heads/main/embypulse-checkin.js#instances=pulse1.example.com%3Bpulse2.example.com%7Crenew

[task_local]
0 8 * * * https://raw.githubusercontent.com/funanzz/EmbyPulse-Check-in/refs/heads/main/embypulse-checkin.js#instances=pulse1.example.com%3Bpulse2.example.com%7Crenew, tag=EmbyPulse 每日签到, enabled=true

[mitm]
# 合并进原 hostname 行，保留已有域名。
hostname = pulse1.example.com, pulse2.example.com
